<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Arabian Store</title>

  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
      background:#0f172a;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
    }

    .card{
      background:#111827;
      padding:25px;
      border-radius:16px;
      width:340px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,0.5);
    }

    /* Welcome to → سفید */
    .welcome{
      color:white;
      font-size:18px;
      margin-bottom:5px;
    }

    /* Arabian Store → قرمز */
    .brand{
      color:red;
      font-size:18px;
      font-weight:bold;
      margin-bottom:15px;
    }

    .info{
      font-size:12px;
      line-height:1.6;
      color:#cbd5e1;
      margin-bottom:15px;
      white-space:pre-line;
    }

    /* شماره تلفن (حتی اگر override شود باز قرمز می‌ماند) */
    .phone{
      color:#ff0000 !important;
      font-weight:bold;
    }

    .btn{
      display:block;
      margin:12px 0;
      padding:14px;
      border-radius:10px;
      text-decoration:none;
      color:white;
      font-weight:bold;
      transition:0.2s;
    }

    .btn:hover{
      transform:scale(1.03);
    }

    .wa{background:#22c55e;}
    .map{background:#f97316;}
  </style>
</head>

<body>
  <div class="card">

    <div class="welcome">Welcome to</div>
    <div class="brand">Arabian Store</div>

    <div class="info">
IT Solutions, CCTV, Advanced Electronics & AI Systems
تكنولوجيا المعلومات، كاميرات المراقبة، الإلكترونيات المتقدمة، والذكاء الاصطناعي

Address: Makani Mall, Maabilah, Muscat, Oman
Tel: <span class="phone" style="color:#ff2d2d !important; text-shadow:0 0 6px red;">
917 91 917
</span>
Email: Arabianstore.oman7@gmail.com

Please choose an option:
    </div>

    <a class="btn wa" href="https://wa.me/96891791917?src=qr" target="_blank">
      WhatsApp
    </a>

    <a class="btn map" href="https://maps.app.goo.gl/ayt5G22mzKddV6TL9?g_st=com.openai.chat.Share" target="_blank">
      Location
    </a>

  </div>
</body>
</html>
