<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Arabian Store</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top, #1f2937, #0f172a);
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  color:white;
}

/* Card */
.card{
  width:360px;
  background:rgba(17,24,39,0.9);
  backdrop-filter: blur(10px);
  border-radius:18px;
  padding:28px;
  box-shadow:0 20px 50px rgba(0,0,0,0.6);
  text-align:center;
}

/* Titles */
.welcome{
  font-size:16px;
  color:#e5e7eb;
  letter-spacing:1px;
}

.brand{
  font-size:24px;
  font-weight:bold;
  color:#ff2d2d;
  margin-top:5px;
  margin-bottom:15px;
}

/* Info */
.info{
  font-size:12px;
  color:#cbd5e1;
  line-height:1.6;
  margin-bottom:15px;
}

/* Phone PRO CARD */
.phone-card{
  background: linear-gradient(135deg, #ff0000, #b30000);
  padding:12px;
  border-radius:12px;
  font-weight:bold;
  margin:15px 0;
  box-shadow:0 10px 20px rgba(255,0,0,0.25);
}

/* Buttons */
.btn{
  display:block;
  margin:10px 0;
  padding:14px;
  border-radius:12px;
  text-decoration:none;
  color:white;
  font-weight:bold;
  transition:0.2s;
}

.btn:hover{
  transform:scale(1.04);
}

.wa{
  background: linear-gradient(135deg, #22c55e, #16a34a);
}

.map{
  background: linear-gradient(135deg, #f97316, #ea580c);
}
</style>
</head>

<body>

<div class="card">

  <div class="welcome">WELCOME TO</div>
  <div class="brand">Arabian Store</div>

  <div class="info">
IT Solutions • CCTV • Advanced Electronics • AI Systems
<br><br>
Address: Makani Mall, Maabilah, Muscat, Oman
  </div>

  <div class="phone-card">
    Tel: 917 91 917
  </div>

  <div class="info">
Email: Arabianstore.oman7@gmail.com
<br><br>
Please choose an option:
  </div>

  <a class="btn wa" href="https://wa.me/96891791917?src=qr" target="_blank">
    WhatsApp
  </a>

  <a class="btn map" href="https://maps.app.goo.gl/ayt5G22mzKddV6TL9?g_st=com.openai.chat.Share" target="_blank">
    Location
  </a>

</div>

</body>
</html>
